<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nerion AI | Access Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    :root {
      --bg:      #030912;
      --card-bg: #0d1628;
      --border:  rgba(139, 92, 246, 0.22);
      --aqua:    #a78bfa;
      --blue:    #60a5fa;
      --danger:  #f87171;
      --text:    #f0f4ff;
      --strong:  #ffffff;
      --muted:   #c8d5e0;
      --subtle:  #8fa3b8;
      --font-body:    'Rajdhani', sans-serif;
      --font-mono:    'Share Tech Mono', monospace;
      --font-heading: 'Orbitron', sans-serif;
      --card-top: inset 0 1px 0 rgba(167, 139, 250, 0.28);
    }
    [data-theme="light"] {
      --bg:      #eef1ff;
      --card-bg: #ffffff;
      --border:  rgba(109, 40, 217, 0.18);
      --aqua:    #6d28d9;
      --blue:    #2563eb;
      --danger:  #dc2626;
      --text:    #0e1121;
      --strong:  #000000;
      --muted:   #374151;
      --subtle:  #6b7280;
      --card-top: inset 0 1px 0 rgba(109, 40, 217, 0.24);
    }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      display: flex;
      position: relative;
      transition: background 0.3s, color 0.3s;
    }

    /* Aurora orbs background */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 15% 50%, rgba(109, 40, 217, 0.2) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(37, 99, 235, 0.13) 0%, transparent 55%),
        radial-gradient(ellipse at 55% 85%, rgba(139, 92, 246, 0.1) 0%, transparent 55%);
      animation: auroraShift 14s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes auroraShift {
      0%   { opacity: 0.7; }
      100% { opacity: 1; }
    }

    /* Scanlines */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 9999;
      background: repeating-linear-gradient(
        0deg, transparent 0px, transparent 2px,
        rgba(139, 92, 246, 0.014) 2px, rgba(139, 92, 246, 0.014) 3px
      );
      pointer-events: none;
    }

    /* ── left panel ── */
    .left-panel {
      width: 55%;
      position: relative;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* animated bubble/node particles */
    .bubbles { position: absolute; inset: 0; pointer-events: none; }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(167, 139, 250, 0.45), rgba(96, 165, 250, 0.1));
      border: 1px solid rgba(167, 139, 250, 0.2);
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(1); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-120px) scale(0.8); opacity: 0; }
    }

    /* jellyfish */
    .jellyfish-wrap { position: relative; z-index: 1; }
    .jelly-body {
      width: 140px; height: 100px;
      border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
      background: radial-gradient(ellipse at 40% 35%, rgba(167, 139, 250, 0.28), rgba(96, 165, 250, 0.12));
      border: 1px solid rgba(167, 139, 250, 0.35);
      position: relative;
      animation: jellPulse 3s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(167, 139, 250, 0.15), inset 0 0 20px rgba(167, 139, 250, 0.07);
    }
    @keyframes jellPulse {
      0%,100% { transform: scaleY(1); }
      50%      { transform: scaleY(0.92); }
    }
    .jelly-tentacles {
      display: flex;
      justify-content: space-around;
      padding: 0 20px;
      margin-top: 4px;
    }
    .jelly-t {
      width: 2px;
      border-radius: 1px;
      background: linear-gradient(to bottom, rgba(167, 139, 250, 0.45), transparent);
      animation: jellWave 2s ease-in-out infinite;
    }
    @keyframes jellWave {
      0%,100% { transform: translateX(0) rotate(0deg); height: 60px; }
      50%      { transform: translateX(4px) rotate(4deg); height: 50px; }
    }

    .left-brand {
      position: absolute;
      bottom: 48px; left: 0; right: 0;
      text-align: center; z-index: 2;
    }
    .left-brand h2 {
      font-family: var(--font-heading);
      font-size: 18px; letter-spacing: 5px;
      background: linear-gradient(135deg, var(--aqua), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .left-brand p {
      font-family: var(--font-mono);
      font-size: 10px; color: var(--muted);
      letter-spacing: 2px; margin-top: 4px;
      opacity: 0.75;
    }

    /* ── right panel ── */
    .right-panel {
      width: 45%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-left: 1px solid var(--border);
      padding: 40px 32px;
      position: relative;
      z-index: 1;
      box-shadow: var(--card-top), -4px 0 32px rgba(0,0,0,0.15);
    }

    .login-box { width: 100%; max-width: 380px; }

    .login-logo { text-align: center; margin-bottom: 8px; }
    .login-logo .fish-icon {
      font-size: 38px; display: block;
      filter: drop-shadow(0 0 18px var(--aqua));
      margin-bottom: 10px;
    }
    .login-logo h1 {
      font-family: var(--font-heading);
      font-size: 22px; letter-spacing: 6px;
      background: linear-gradient(135deg, var(--aqua), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-logo p {
      font-family: var(--font-mono);
      font-size: 10px; color: var(--muted);
      letter-spacing: 2px; margin-top: 4px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--aqua), transparent);
      opacity: 0.3; margin: 22px 0;
    }

    /* tab toggles */
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 26px; }
    .auth-tab {
      flex: 1; padding: 10px;
      border: 1px solid rgba(139, 92, 246, 0.18);
      background: transparent; color: var(--muted);
      border-radius: 50px; cursor: pointer;
      font-family: var(--font-mono); font-size: 12px;
      letter-spacing: 1px; transition: all 0.2s;
    }
    .auth-tab.active {
      background: linear-gradient(135deg, var(--aqua), var(--blue));
      color: #ffffff; border-color: transparent;
      font-weight: 700;
      box-shadow: 0 0 16px rgba(167, 139, 250, 0.3);
    }

    /* float-label inputs */
    .fl-group { position: relative; margin-bottom: 30px; }
    .fl-group label {
      position: absolute; left: 36px; top: 14px;
      font-family: var(--font-mono); font-size: 13px;
      color: var(--muted); pointer-events: none;
      transition: all 0.2s ease;
    }
    .fl-group input:focus ~ label,
    .fl-group input:not(:placeholder-shown) ~ label {
      top: -12px; left: 4px; font-size: 10px;
      color: var(--aqua); letter-spacing: 1px;
    }
    .fl-icon {
      position: absolute; left: 10px; top: 14px;
      color: var(--muted); font-size: 14px; pointer-events: none;
    }
    .fl-group input {
      width: 100%;
      padding: 14px 12px 6px 36px;
      background: rgba(167, 139, 250, 0.04);
      border: none;
      border-bottom: 2px solid var(--border);
      border-radius: 4px 4px 0 0;
      color: var(--strong);
      font-family: var(--font-mono); font-size: 14px;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    .fl-group input:focus {
      background: rgba(167, 139, 250, 0.06);
      border-bottom-color: var(--aqua);
      box-shadow: 0 3px 14px rgba(167, 139, 250, 0.18);
    }
    .fl-group input::placeholder { color: transparent; }

    /* submit button */
    .btn-auth {
      width: 100%; height: 48px; border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--aqua), var(--blue));
      color: #ffffff; font-family: var(--font-heading);
      font-size: 11px; letter-spacing: 3px;
      cursor: pointer; font-weight: 700;
      transition: all 0.25s; position: relative; overflow: hidden;
    }
    .btn-auth::before {
      content: ''; position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      transition: left 0.45s ease;
    }
    .btn-auth:hover::before { left: 100%; }
    .btn-auth:hover {
      box-shadow: 0 0 32px rgba(167, 139, 250, 0.4), 0 4px 20px rgba(0,0,0,0.3);
      transform: translateY(-1px);
    }
    .btn-auth:active { transform: scale(0.98); }
    .btn-auth:disabled { opacity: 0.5; cursor: not-allowed; }

    /* error */
    #error-msg {
      color: var(--danger);
      font-family: var(--font-mono); font-size: 12px;
      text-align: center; margin-bottom: 12px;
      display: none;
      text-shadow: 0 0 8px rgba(248, 113, 113, 0.4);
      animation: errFade 0.3s ease;
    }
    @keyframes errFade {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .left-panel { display: none; }
      .right-panel { width: 100%; border-left: none; }
    }
  </style>
</head>
<body>

  <!-- Left animated panel -->
  <div class="left-panel">
    <div class="bubbles" id="bubbles"></div>

    <div class="jellyfish-wrap">
      <div class="jelly-body"></div>
      <div class="jelly-tentacles">
        <div class="jelly-t" style="animation-delay:0s"></div>
        <div class="jelly-t" style="animation-delay:0.2s"></div>
        <div class="jelly-t" style="animation-delay:0.4s"></div>
        <div class="jelly-t" style="animation-delay:0.1s"></div>
        <div class="jelly-t" style="animation-delay:0.3s"></div>
        <div class="jelly-t" style="animation-delay:0.5s"></div>
        <div class="jelly-t" style="animation-delay:0.15s"></div>
      </div>
    </div>

    <div class="left-brand">
      <h2>NERION AI</h2>
      <p>AQUATIC INTELLIGENCE PLATFORM</p>
    </div>
  </div>

  <!-- Right login panel -->
  <div class="right-panel">
    <div class="login-box">

      <div class="login-logo">
        <span class="fish-icon">🐠</span>
        <h1>NERION</h1>
        <p>MONITORING SYSTEM v2.1</p>
      </div>

      <div class="divider"></div>

      <div class="auth-tabs">
        <button id="tab-login"  class="auth-tab active" onclick="switchMode('login')">LOGIN</button>
        <button id="tab-signup" class="auth-tab"         onclick="switchMode('signup')">SIGN UP</button>
      </div>

      <div class="fl-group">
        <span class="fl-icon">👤</span>
        <input type="text" id="username" placeholder="username" autocomplete="username">
        <label>USERNAME</label>
      </div>

      <div class="fl-group">
        <span class="fl-icon">🔒</span>
        <input type="password" id="password" placeholder="password" autocomplete="current-password">
        <label>PASSWORD</label>
      </div>

      <div id="error-msg"></div>

      <button class="btn-auth" id="submit-btn" onclick="handleSubmit()">AUTHENTICATE</button>
    </div>
  </div>

  <script>
    (function() {
      var container = document.getElementById('bubbles');
      for (var i = 0; i < 18; i++) {
        var b = document.createElement('div');
        b.className = 'bubble';
        var size = 6 + Math.random() * 24;
        b.style.cssText = [
          'width:' + size + 'px',
          'height:' + size + 'px',
          'left:' + (Math.random() * 100) + '%',
          'animation-duration:' + (6 + Math.random() * 10) + 's',
          'animation-delay:' + (Math.random() * 8) + 's'
        ].join(';');
        container.appendChild(b);
      }
    })();

    let currentMode = 'login';

    if (localStorage.getItem('aq_user')) {
      window.location.href = '/';
    }

    /* restore theme */
    if (localStorage.getItem('nerion_theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
      document.getElementById('submit-btn').textContent = mode === 'login' ? 'AUTHENTICATE' : 'CREATE ACCOUNT';
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    async function handleSubmit() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl  = document.getElementById('error-msg');
      const btn      = document.getElementById('submit-btn');

      errorEl.style.display = 'none';

      if (!username || !password) {
        errorEl.textContent = 'Please enter your username and password.';
        errorEl.style.display = 'block';
        return;
      }

      const endpoint = currentMode === 'login' ? '/api/login' : '/api/signup';
      btn.textContent = 'Please wait…';
      btn.disabled = true;

      try {
        const res  = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const json = await res.json();

        if (json.success) {
          localStorage.setItem('aq_user', JSON.stringify(json.data));
          window.location.href = '/';
        } else {
          errorEl.textContent = json.message || 'Something went wrong.';
          errorEl.style.display = 'block';
        }
      } catch (e) {
        errorEl.textContent = 'Could not connect to server.';
        errorEl.style.display = 'block';
        console.error(e);
      } finally {
        btn.textContent = currentMode === 'login' ? 'AUTHENTICATE' : 'CREATE ACCOUNT';
        btn.disabled = false;
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleSubmit();
    });
  </script>
</body>
</html>
