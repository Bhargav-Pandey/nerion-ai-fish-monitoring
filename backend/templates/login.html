<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaGuard AI | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card { padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; }
        .logo-large { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }
        .error-msg { color: var(--danger-color); font-size: 13px; text-align: center; margin-bottom: 10px; display: none; }
        .tab-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-toggle button {
            flex: 1; padding: 10px; border: 1px solid var(--glass-border);
            background: transparent; color: var(--text-muted);
            border-radius: 8px; cursor: pointer; font-family: 'Poppins', sans-serif;
            font-size: 14px; transition: 0.2s;
        }
        .tab-toggle button.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="login-page">
        <div class="glass-panel login-card">
            <div class="logo-large">🐟 AquaGuard <span class="highlight">AI</span></div>
            <p class="subtitle">Secure Admin Access</p>

            <div class="tab-toggle">
                <button id="tab-login" class="active" onclick="switchMode('login')">Login</button>
                <button id="tab-signup" onclick="switchMode('signup')">Sign Up</button>
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" autocomplete="username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>

            <div id="error-msg" class="error-msg"></div>

            <button class="btn-primary" id="submit-btn" onclick="handleSubmit()">ACCESS SYSTEM</button>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        // If already logged in, go straight to dashboard
        if (localStorage.getItem('aq_user')) {
            window.location.href = '/';
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
            document.getElementById('submit-btn').textContent = mode === 'login' ? 'ACCESS SYSTEM' : 'CREATE ACCOUNT';
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        async function handleSubmit() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('error-msg');
            const btn = document.getElementById('submit-btn');

            errorEl.style.display = 'none';

            if (!username || !password) {
                errorEl.textContent = 'Please enter your username and password.';
                errorEl.style.display = 'block';
                return;
            }

            const endpoint = currentMode === 'login' ? '/api/login' : '/api/signup';
            btn.textContent = 'Please wait...';
            btn.disabled = true;

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const json = await res.json();

                if (json.success) {
                    localStorage.setItem('aq_user', JSON.stringify(json.data));
                    window.location.href = '/';
                } else {
                    errorEl.textContent = json.message || 'Something went wrong.';
                    errorEl.style.display = 'block';
                }
            } catch (e) {
                errorEl.textContent = 'Could not connect to server.';
                errorEl.style.display = 'block';
                console.error(e);
            } finally {
                btn.textContent = currentMode === 'login' ? 'ACCESS SYSTEM' : 'CREATE ACCOUNT';
                btn.disabled = false;
            }
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') handleSubmit();
        });
    </script>
</body>
</html>
